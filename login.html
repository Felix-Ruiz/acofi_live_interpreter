<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acofi Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        :root {
            --color-fondo: #FDFEFE;
            --color-principal: #00a884;
            --color-texto: #1E293B;
            --color-texto-mutado: #94A3B8;
            --glow-color: rgba(0, 168, 132, 0.4);
            --color-panel-separador: rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }

        /* Diseño del Login */
        .login-container {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--color-panel-separador);
        }
        .login-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--color-texto);
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--color-texto-mutado);
            margin-bottom: 30px;
        }
        input[type="password"] {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        input[type="password"]:focus {
            border-color: var(--color-principal);
            box-shadow: 0 0 0 3px var(--glow-color);
        }
        .login-btn {
            background-color: var(--color-principal);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 50px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                inset 2px 2px 5px rgba(255, 255, 255, 0.4),
                inset -3px -3px 7px rgba(0, 0, 0, 0.15),
                0px 8px 20px var(--glow-color);
        }
        .error {
            color: #ea0038;
            font-size: 13px;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Diseño del Pop-up de Instalación */
        .install-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .install-card {
            background: #FFFFFF;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            border: 1px solid var(--color-panel-separador);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .install-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--color-principal), #008f6f);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px var(--glow-color);
        }
        .install-icon svg { width: 35px; height: 35px; fill: #FFFFFF; }
        .instruction-box {
            background: #F8FAFC;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 14px;
            color: var(--color-texto);
            line-height: 1.5;
            text-align: left;
            border: 1px solid #E2E8F0;
        }
        .skip-btn {
            background: transparent;
            border: none;
            color: var(--color-texto-mutado);
            font-weight: 600;
            font-size: 14px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Pop-up PWA -->
    <div class="install-overlay" id="installOverlay">
        <div class="install-card">
            <div class="install-icon">
                <svg viewBox="0 0 24 24"><path d="M21 16v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h2 class="login-title" style="margin-bottom: 10px;">Instala la Aplicación</h2>
            <p class="login-subtitle" style="margin-bottom: 10px;">Para una experiencia nativa y en pantalla completa.</p>
            
            <div id="android-ui" style="display:none;">
                <button class="login-btn" id="btnInstallAndroid" style="margin-top: 15px;">Instalar Ahora</button>
            </div>

            <div id="ios-ui" style="display:none;" class="instruction-box">
                Para instalar en iPhone/iPad:<br><br>
                1. Toca el botón <b>Compartir</b> <svg style="width:14px; vertical-align:middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg> en la barra inferior de Safari.<br>
                2. Selecciona <b>"Agregar a Inicio"</b> <svg style="width:14px; vertical-align:middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>.
            </div>

            <button class="skip-btn" onclick="cerrarPopup()">Ir al Login</button>
        </div>
    </div>

    <!-- Login UI -->
    <div class="login-container">
        <div class="login-title">Acofi • Live Interpreter</div>
        <div class="login-subtitle">Sistema de Traducción Simultánea</div>
        
        <form action="/login" method="POST">
            <input type="password" name="password" placeholder="Contraseña de Acceso" required>
            <button type="submit" class="login-btn">Acceder al Sistema</button>
        </form>
        <div id="error-msg" class="error" style="display: none;">Acceso denegado. Contraseña incorrecta.</div>
    </div>

    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const installOverlay = document.getElementById('installOverlay');
        const iosUI = document.getElementById('ios-ui');
        const androidUI = document.getElementById('android-ui');
        let deferredPrompt;

        if (!isStandalone && !localStorage.getItem('pwa_skip')) {
            installOverlay.style.display = 'flex';
            
            if (isIOS) {
                iosUI.style.display = 'block';
            } else {
                androidUI.style.display = 'block';
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            androidUI.style.display = 'block';
        });

        document.getElementById('btnInstallAndroid')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') cerrarPopup();
                deferredPrompt = null;
            }
        });

        function cerrarPopup() {
            installOverlay.style.display = 'none';
            localStorage.setItem('pwa_skip', 'true');
        }
    </script>
</body>
</html>
